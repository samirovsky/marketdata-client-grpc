# Generated at build time into gen/ (not committed): `go generate ./...`.
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/samirovsky/marketdata-client-grpc/gen
plugins:
  - local: ["go", "run", "google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.1"]
    out: gen
    opt: paths=source_relative
  - local: ["go", "run", "google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1"]
    out: gen
    opt: paths=source_relative
