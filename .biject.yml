# How biject builds, tests and measures this repository. The gRPC stubs are generated at
# build time from the vendored proto/ files; gcov2lcov turns Go's profile into LCOV.
build: go generate ./... && go build ./...
test: go test ./... -coverprofile=cover.out && go run github.com/jandelgado/gcov2lcov@v1.1.1 -infile cover.out -outfile lcov.info
coverage: { format: lcov, path: lcov.info }
